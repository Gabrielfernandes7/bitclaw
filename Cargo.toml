[package]
name = "bitclaw"
version = "0.2.0"
edition = "2024"
description = "Agente de código local para modelos pequenos, no terminal"
repository = "https://github.com/Gabrielfernandes7/bitclaw"
license-file = "LICENSE"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
toml = "1.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
resvg = { version = "0.50.0", default-features = false }
