# Publica o site de documentação (site/) no GitHub Pages.
# Ative uma vez em Settings > Pages > Build and deployment > Source: "GitHub Actions".
# O site é gerado por site/build.py a partir de site/content, docs/ e dos SVGs da identidade.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r site/requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Gerar o site
        run: python3 site/build.py --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
